name: Build APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # Release build also fires on tag pushes like v1.0.4
  release:
    types: [created]

jobs:
  # ── DEBUG APK ──────────────────────────────────────────────────────────────
  # Runs on every push; APK is attached to the workflow run as an artifact.
  debug-apk:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK / NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/*.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache native build (ccache)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: native-${{ runner.os }}

      - name: Vendor stable-diffusion.cpp
        # This directory is intentionally empty in the repo. Cloning at build
        # time keeps the repo lean and avoids tracking upstream churn.
        run: |
          cd local_plugins/sd_flutter_android/android/src/main/cpp
          if [ -z "$(ls -A stable-diffusion.cpp)" ]; then
            rm -rf stable-diffusion.cpp
            git clone --depth 1 --recurse-submodules \
              https://github.com/leejet/stable-diffusion.cpp stable-diffusion.cpp
          fi

      - name: flutter pub get
        run: flutter pub get

      - name: Build debug APK
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: privatelm-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  # ── RELEASE APK ────────────────────────────────────────────────────────────
  # Fires on `release: created` events (i.e. when you publish a GitHub Release,
  # typically via `git tag v1.x.y && git push --tags` followed by clicking
  # "Create release from tag" in the UI). Attaches the APK to that release.
  release-apk:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # required for upload_release_asset
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK / NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/*.kts') }}

      - name: Cache native build (ccache)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: native-${{ runner.os }}-release

      - name: Vendor stable-diffusion.cpp
        run: |
          cd local_plugins/sd_flutter_android/android/src/main/cpp
          if [ -z "$(ls -A stable-diffusion.cpp)" ]; then
            rm -rf stable-diffusion.cpp
            git clone --depth 1 --recurse-submodules \
              https://github.com/leejet/stable-diffusion.cpp stable-diffusion.cpp
          fi

      - name: Decode release keystore (optional)
        # If you've configured ANDROID_KEYSTORE_BASE64 + ANDROID_KEY_PASSWORD +
        # ANDROID_STORE_PASSWORD + ANDROID_KEY_ALIAS as repo secrets, decode and
        # wire them in. Without them, the build falls back to the debug
        # keystore (see android/app/build.gradle.kts) — installs fine via
        # sideload but won't be Play-Store eligible.
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat >> android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: flutter pub get
        run: flutter pub get

      - name: Build release APK
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: flutter build apk --release

      - name: Rename APK with version
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/PrivateLM-${{ github.event.release.tag_name }}.apk

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/PrivateLM-${{ github.event.release.tag_name }}.apk
