name: Build APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # Release build also fires on tag pushes like v1.0.4
  release:
    types: [created]

jobs:
  # ── DEBUG APK ──────────────────────────────────────────────────────────────
  # Runs on every push; APK is attached to the workflow run as an artifact.
  debug-apk:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK
        # Intentionally NOT pinning an NDK here. Flutter's gradle plugin
        # downloads the NDK version it wants (flutter.ndkVersion) on first
        # use; pinning a mismatched version triggers a second download +
        # version-skew errors that surface as confusing failures.
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 cmake;3.22.1'

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/*.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache native build (ccache)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: native-${{ runner.os }}

      - name: Vendor stable-diffusion.cpp
        # The directory is intentionally empty in the repo. Always re-clone
        # to get a clean checkout, and use --shallow-submodules so the ggml
        # submodule stays fast without hitting the shallow+recurse exit-128
        # trap that happens when submodule SHAs are outside shallow history.
        run: |
          set -euxo pipefail
          cd local_plugins/sd_flutter_android/android/src/main/cpp
          rm -rf stable-diffusion.cpp
          git clone --recurse-submodules --shallow-submodules \
            https://github.com/leejet/stable-diffusion.cpp stable-diffusion.cpp
          # Smoke check — the JNI wrapper #includes stable-diffusion.h, so
          # the build will only get past CMake configure if this exists.
          test -f stable-diffusion.cpp/include/stable-diffusion.h || \
            (echo "FATAL: stable-diffusion.h not found after clone" && exit 1)

      - name: Configure git identity
        # Some build tools (gradle, cmake) shell out to git internally and
        # error if user.email is unset.
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"

      - name: flutter pub get
        run: flutter pub get

      - name: flutter doctor (diagnostics)
        # Prints SDK / NDK / cmdline-tools / Java versions. If the next step
        # fails, this block tells us exactly what's mismatched.
        run: flutter doctor -v

      - name: Build debug APK
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: flutter build apk --debug --verbose 2>&1 | tee build.log

      - name: Locate APK output
        # Help the next step's glob match by reporting exactly where the APK
        # landed. Flutter has moved this path between versions
        # (build/app/outputs/flutter-apk vs build/app/outputs/apk/debug).
        if: always()
        run: |
          echo "== find APKs under build/ =="
          find build -name '*.apk' 2>/dev/null || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: privatelm-debug-${{ github.sha }}
          # Catch both the legacy and newer Flutter output paths.
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/debug/*.apk
            build/app/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        # Always upload so we have something to look at if the build is
        # silently producing the wrong artifact path.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          retention-days: 14

  # ── RELEASE APK ────────────────────────────────────────────────────────────
  # Fires on `release: created` events (i.e. when you publish a GitHub Release,
  # typically via `git tag v1.x.y && git push --tags` followed by clicking
  # "Create release from tag" in the UI). Attaches the APK to that release.
  release-apk:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # required for upload_release_asset
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK
        # Intentionally NOT pinning an NDK here. Flutter's gradle plugin
        # downloads the NDK version it wants (flutter.ndkVersion) on first
        # use; pinning a mismatched version triggers a second download +
        # version-skew errors that surface as confusing failures.
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 cmake;3.22.1'

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/*.kts') }}

      - name: Cache native build (ccache)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: native-${{ runner.os }}-release

      - name: Vendor stable-diffusion.cpp
        run: |
          set -euxo pipefail
          cd local_plugins/sd_flutter_android/android/src/main/cpp
          rm -rf stable-diffusion.cpp
          git clone --recurse-submodules --shallow-submodules \
            https://github.com/leejet/stable-diffusion.cpp stable-diffusion.cpp
          test -f stable-diffusion.cpp/include/stable-diffusion.h || \
            (echo "FATAL: stable-diffusion.h not found after clone" && exit 1)

      - name: Decode release keystore (optional)
        # If you've configured ANDROID_KEYSTORE_BASE64 + ANDROID_KEY_PASSWORD +
        # ANDROID_STORE_PASSWORD + ANDROID_KEY_ALIAS as repo secrets, decode and
        # wire them in. Without them, the build falls back to the debug
        # keystore (see android/app/build.gradle.kts) — installs fine via
        # sideload but won't be Play-Store eligible.
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat >> android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"

      - name: flutter pub get
        run: flutter pub get

      - name: flutter doctor (diagnostics)
        run: flutter doctor -v

      - name: Build release APK
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: flutter build apk --release --verbose 2>&1 | tee build.log

      - name: Locate + rename APK
        run: |
          set -e
          # Find wherever Flutter parked the release APK and rename it.
          src=$(find build -name 'app-release.apk' | head -n 1)
          if [ -z "$src" ]; then
            echo "FATAL: no app-release.apk found under build/" && exit 1
          fi
          dst="build/PrivateLM-${{ github.event.release.tag_name }}.apk"
          mv "$src" "$dst"
          echo "APK_PATH=$dst" >> "$GITHUB_ENV"

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
